services:
  rabbitmq:
    image: rabbitmq:3.13-management
    # inbox, архив и stream other - состояние системы: данные переживают `make down`;
    # hostname фиксирован, по нему RabbitMQ называет каталог данных узла
    hostname: llm-sorter-rabbit
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports: ["${RABBIT_PORT:-5672}:5672", "${RABBIT_MGMT_PORT:-15672}:15672"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]

volumes:
  rabbitdata:
